<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Currency Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Currency Explorer</h1>
  <p class="sub">Compare today’s exchange rates for every major currency. Search, filter, sort, and convert.</p>
</header>

<main>
  <section class="controls" aria-label="Controls">
    <label>Amount
      <input id="amount" type="number" min="0" step="any" value="1">
    </label>
    <label>From
      <select id="base"></select>
    </label>
    <label>Search
      <input id="search" type="search" placeholder="Code or name">
    </label>
    <label>Show
      <select id="filter">
        <option value="all">All currencies</option>
        <option value="major">Major currencies</option>
        <option value="stronger">Worth more than 1 unit of base</option>
        <option value="weaker">Worth less than 1 unit of base</option>
      </select>
    </label>
    <label>Sort by
      <select id="sort">
        <option value="code-asc">Code (A–Z)</option>
        <option value="name-asc">Name (A–Z)</option>
        <option value="value-desc">Value (high–low)</option>
        <option value="value-asc">Value (low–high)</option>
      </select>
    </label>
  </section>

  <p id="status" role="status" aria-live="polite"></p>
  <div id="error" class="error" role="alert" hidden></div>

  <div class="table-wrap">
    <table>
      <thead><tr><th>Code</th><th>Currency</th><th class="num">Converted</th><th class="num">Rate</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<footer>
  <span id="meta"></span>
  <span>Data: <a href="https://www.exchangerate-api.com">ExchangeRate-API</a></span>
</footer>
<script src="app.js"></script>
</body>
</html>
